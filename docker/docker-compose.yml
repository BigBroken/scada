services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: wellpad-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: wellpad-postgres
    environment:
      POSTGRES_DB: ignition_history
      POSTGRES_USER: ignition
      POSTGRES_PASSWORD: ignition
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ignition -d ignition_history"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mosquitto_data:
  mosquitto_log:
  postgres_data:
